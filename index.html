<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Anime Vault PRO</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0b1220">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #020617;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .card {
      background: #0b1220;
      padding: 25px;
      border-radius: 15px;
      width: 90%;
      max-width: 420px;
      box-shadow: 0 0 20px rgba(0,0,0,0.6);
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
    }

    button, input {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border-radius: 8px;
      border: none;
      font-size: 16px;
    }

    button {
      background: #6366f1;
      color: white;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    .guest {
      background: #374151;
    }

    .note {
      font-size: 12px;
      opacity: 0.7;
      margin-top: 10px;
      text-align: center;
    }
  </style>
</head>

<body>

  <div class="card">
    <h1>⚔️ Anime Vault PRO</h1>

    <button class="guest" onclick="guestMode()">Guest (View Only)</button>

    <input type="password" id="pin" placeholder="Owner PIN">

    <button onclick="ownerLogin()">Owner Login</button>

    <div class="note">Default PIN: 1234</div>
  </div>

<script>
  function guestMode() {
    alert("Guest Mode Activated ✅");
  }

  function ownerLogin() {
    const pin = document.getElementById("pin").value;
    if (pin === "1234") {
      alert("Owner Login Successful 🔥");
    } else {
      alert("Wrong PIN ❌");
    }
  }

  // PWA Service Worker
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js");
  }
</script>

</body>
</html>
